<!DOCTYPE html>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l1.6-2.4h6.8L17 8h3a1 1 0 0 1 1 1v9.5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13.3" r="3.6" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M6 3.5h9.5L19 7v13.5H6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M15 3.5V7.5h4M9 12h7M9 15.5h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>

<div id="app">
  <header id="top">
    <div id="petBar"></div>
  </header>
  <main id="view"></main>
  <nav id="tabs">
    <button data-tab="home"><svg><use href="#i-home"/></svg><span>ホーム</span></button>
    <button data-tab="weight"><svg><use href="#i-scale"/></svg><span>体重</span></button>
    <button data-tab="photo"><svg><use href="#i-camera"/></svg><span>写真</span></button>
    <button data-tab="pet"><svg><use href="#i-gear"/></svg><span>設定</span></button>
  </nav>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-back"></div>
  <div class="sheet-body" role="dialog" aria-modal="true"></div>
</div>

<div id="toast" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
